version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    ignore:
      # TypeScript 7 is the native compiler: it has no JavaScript API yet, and vue-tsc and typescript-eslint need it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    target-branch: "develop"
    schedule:
      interval: "monthly"
